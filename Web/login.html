<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Intranet</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Usamos .wrap para centrar el contenido y darle margen superior -->
    <div class="wrap" style="max-width: 450px;">
        
        <!-- Usamos .card para darle el fondo oscuro, borde morado y sombra -->
        <div class="card">
            <h2>Iniciar Sesión</h2>
            
            <form action="php/login.php" method="POST">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <!-- Usamos .btn para darle el degradado morado/ámbar -->
                <button type="submit" class="btn" style="width: 100%;">Entrar</button>
            </form>
        </div>

    </div>
</body>
</html>
